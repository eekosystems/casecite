# Production Docker Compose for Hetzner/VPS Deployment
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Image source: the backend (and the one-shot frontend-build step, which copies
# the SPA out of the same image) run CASECITE_IMAGE:CASECITE_TAG. With the
# defaults that is the image CI publishes to GHCR, so `pull` + `up -d` deploys
# and `CASECITE_TAG=<sha> ... up -d` rolls back to any earlier build. To build
# from source instead: `docker compose -f docker-compose.prod.yml up -d --build`
# (the local build is tagged with the same name).
#
# Encryption at rest: client text lives in THREE named volumes, not one —
# rag_data (uploads, vector index, audit logs), postgres_data (chat history,
# analyses, clause text) and redis_data (job results, revocation and lockout keys). Put all
# of /var/lib/docker/volumes (or each volume's backing device) on an encrypted
# disk (LUKS or provider disk encryption) before setting
# DISK_ENCRYPTION_ACKNOWLEDGED=true.

services:
  # Caddy - Automatic HTTPS reverse proxy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/srv:ro
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    healthcheck:
      # Caddy's admin endpoint (localhost:2019) answers once config is loaded
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - casecite_network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casecite
      POSTGRES_USER: ${POSTGRES_USER:-casecite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # The role the app connects as. PostgreSQL exempts superusers (which
      # POSTGRES_USER is) from row-level security, so a fresh install should
      # set APP_DB_USER and APP_DB_PASSWORD in .env: the init script below
      # creates that non-superuser role on first start. Existing installs:
      # docs/deployment.md, "Row-level security needs a non-superuser app role".
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casecite} -d casecite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - casecite_network

  # Redis for session/token management and rate limiting
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction, not an LRU policy: Redis holds revoked-token markers,
    # deleted-user tombstones, account-lockout counters and consumed MFA
    # challenges. Under allkeys-lru (or volatile-lru — these keys all carry
    # TTLs) memory pressure silently drops them, which revives logged-out
    # tokens and resets lockouts. With noeviction a full instance rejects new
    # writes instead, and the app fails closed. Everything the app stores has a
    # TTL, so memory is reclaimed by expiry; raise --maxmemory if job results
    # fill it.
    # (The password is passed as an argument, so it is visible to `ps` inside
    # this container only; the network is not published to the host.)
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      # Authenticate: an unauthenticated `ping` against --requirepass returns
      # NOAUTH, which is a reply, not a failure — the check would pass while
      # the server was unusable.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - casecite_network

  # Backend API
  backend:
    image: ${CASECITE_IMAGE:-ghcr.io/thomasunise/casecite}:${CASECITE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Non-secret configuration only; secrets come from .env via env_file
      - DEBUG=false
      # .env.example ships ENVIRONMENT=development so a fresh copy runs locally;
      # this stack is the production deployment, so label it as such for
      # /health and the logs regardless of what .env says.
      - ENVIRONMENT=production
      # The bundled postgres:16-alpine has no TLS and lives only on the isolated
      # casecite_network below, so default to the in-network no-TLS mode. If you
      # point DATABASE_URL at a managed/external database, set DB_SSL=require.
      - DB_SSL=${DB_SSL:-internal}
      - VECTOR_DB=chroma
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      # Defaults to DOMAIN; set ALLOWED_HOSTS in .env to serve extra hostnames
      # (comma-separated). Loopback is always allowed for the healthcheck.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-${DOMAIN:-localhost}}
      # The backup key must never reach the app container even if an operator
      # leaves it in .env (env_file above injects that whole file).
      - BACKUP_ENCRYPTION_KEY=
      # Confirm the Docker volumes (rag_data, postgres_data, redis_data — see the
      # header) are on an encrypted disk (LUKS or provider disk encryption).
      # Derived privileged text is stored in cleartext; the app refuses to
      # start until this is set to true.
      - DISK_ENCRYPTION_ACKNOWLEDGED=${DISK_ENCRYPTION_ACKNOWLEDGED:?enable full-disk encryption on the data volume, then set to true}
      # Must be an IP or CIDR (hostnames are not parseable). Matches the pinned
      # casecite_network subnet below so Caddy's X-Forwarded-For is honored.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.28.0.0/24}
      # Connect as the non-superuser app role when one is configured (so
      # row-level security is enforced), else as POSTGRES_USER as before.
      - DATABASE_URL=postgresql+asyncpg://${APP_DB_USER:-${POSTGRES_USER:-casecite}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/casecite
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - rag_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # uvicorn directly (Caddy proxies to backend:8000, not to the image's nginx)
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations and first-boot seeding run before uvicorn listens.
      start_period: 90s
    networks:
      - casecite_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Frontend publisher (runs once per deploy to populate the dist volume Caddy
  # serves). Copies the SPA out of the SAME backend image, so a pulled image
  # deploys without a local source checkout and a rollback tag rolls the
  # frontend back with it.
  frontend-build:
    image: ${CASECITE_IMAGE:-ghcr.io/thomasunise/casecite}:${CASECITE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/output
    # Clear the volume before copying so upgrades never serve stale hashed
    # assets left over from a previous build.
    entrypoint: ["sh", "-c", "rm -rf /output/* && cp -r /var/www/html/. /output/"]
    restart: "no"

volumes:
  rag_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  frontend_dist:
    driver: local

networks:
  casecite_network:
    driver: bridge
    ipam:
      config:
        # Pinned so TRUSTED_PROXIES above stays correct across recreations.
        - subnet: 172.28.0.0/24
