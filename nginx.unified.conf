# Single-container deployment (Dockerfile / Coolify) - proxies to localhost:8000

# TLS is terminated by the platform proxy in front of this container
# (Coolify/Traefik), so $scheme here is always "http". Pass the upstream
# X-Forwarded-Proto through and fall back to $scheme only when there is none;
# overwriting it made the backend think every request was plain HTTP and issue
# auth/CSRF cookies without the Secure flag.
map $http_x_forwarded_proto $casecite_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Security headers for static files (API headers are set by FastAPI middleware).
    # CSP mirrors middleware/security.py: Google Sign-In + Picker (loaded only
    # when the Google picker opens), Dropbox Chooser and Box picker scripts;
    # Microsoft Graph + the OneDrive/SharePoint picker form post. Fonts are
    # bundled. It must be on the HTML shell, not just /api/*.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.dropbox.com https://cdn01.boxcdn.net; style-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn01.boxcdn.net; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://accounts.google.com https://apis.google.com https://www.googleapis.com https://api.box.com https://upload.box.com; frame-src 'self' blob: https://accounts.google.com https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://onedrive.live.com https://*.sharepoint.com" always;
    # Ignored by browsers on plain HTTP; effective once TLS is in front (Coolify/Traefik/Caddy).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Word add-in task pane (static, built into the image). Office loads it
    # over HTTPS from this origin; the manifest comes from /api/v1/addin/.
    location /addin/ {
        try_files $uri $uri/ /addin/index.html;
    }

    # Frontend - serve static files
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            # add_header is not inherited once a location declares its own, so
            # the server-level security headers are repeated here.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.dropbox.com https://cdn01.boxcdn.net; style-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn01.boxcdn.net; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://accounts.google.com https://apis.google.com https://www.googleapis.com https://api.box.com https://upload.box.com; frame-src 'self' blob: https://accounts.google.com https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://onedrive.live.com https://*.sharepoint.com" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }

    # API - proxy to Python backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $casecite_forwarded_proto;
        # Must exceed the strategy case-law stage budget
        # (CASE_LAW_TIME_BUDGET_SECONDS in backend/app/services/strategy.py)
        # plus synthesis time — full-opinion reading is slow by design.
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $casecite_forwarded_proto;
    }

    # Ready check endpoint
    location /ready {
        proxy_pass http://127.0.0.1:8000/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $casecite_forwarded_proto;
    }

    # Metrics endpoint
    location /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $casecite_forwarded_proto;
    }

    # Larger file uploads
    client_max_body_size 100M;

    # Disable server version exposure
    server_tokens off;
}
