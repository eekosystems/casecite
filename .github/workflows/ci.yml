name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    # A version tag builds and publishes a version-tagged image (see `build`).
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default: gitleaks-action needs pull-requests:read to
# enumerate PR commits. The write scopes (packages for the GHCR push,
# security-events for the Trivy SARIF upload) are granted to the `build` job
# only. On pull requests that job builds and scans the image without logging
# in to or pushing to GHCR (and a fork's token is read-only anyway).
#
# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, which moves
# to a new release on GitHub's schedule, not ours.
#
# Third-party actions are pinned to commit SHAs (the trailing comment is the
# tag the SHA was resolved from); Dependabot's github-actions ecosystem
# proposes the bumps.
permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ====================
  # Security Scanning
  # ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # gitleaks scans the full pushed commit range; a shallow clone makes
          # git fail to resolve the range and the scan errors out.
          fetch-depth: 0

      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"  # Avoid SARIF upload issues

      - name: Verify no secrets detected
        run: |
          # Install gitleaks for explicit verification. Extract OUTSIDE the
          # repo: the tarball ships gitleaks' own README/LICENSE, which contain
          # example AWS keys — unpacking into . made the scan flag them as leaks.
          GITLEAKS_DIR="$(mktemp -d)"
          GITLEAKS_TGZ="$GITLEAKS_DIR/gitleaks.tar.gz"
          wget -qO "$GITLEAKS_TGZ" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          # SHA-256 from the release's gitleaks_8.18.4_checksums.txt — a
          # tampered or swapped download fails here instead of being executed.
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $GITLEAKS_TGZ" | sha256sum -c -
          tar xzf "$GITLEAKS_TGZ" -C "$GITLEAKS_DIR"
          chmod +x "$GITLEAKS_DIR/gitleaks"
          # Run gitleaks and capture output. --redact: this repo is public, and
          # the report is printed to the log and uploaded as an artifact.
          "$GITLEAKS_DIR/gitleaks" detect --source . --redact --report-format json --report-path gitleaks-report.json --no-git || LEAKS_FOUND=$?
          if [ "${LEAKS_FOUND:-0}" -eq 1 ]; then
            echo "::error::Secrets detected! Review gitleaks-report.json"
            cat gitleaks-report.json
            exit 1
          elif [ "${LEAKS_FOUND:-0}" -ne 0 ]; then
            # Any other exit code means the scan itself failed — never a pass.
            echo "::error::gitleaks exited with code $LEAKS_FOUND; the scan did not complete"
            exit 1
          fi
          echo "✅ No secrets detected"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          # Pinned versions live in backend/requirements-dev.txt
          pip install $(grep -E '^(bandit|pip-audit)==' backend/requirements-dev.txt)

      - name: Run Bandit (Python Security Linter)
        run: |
          bandit -r backend/app -f json -o bandit-report.json --severity-level medium
          bandit -r backend/app -f txt --severity-level medium

      # Dependency vulnerability scanning is handled by pip-audit (below) and
      # Trivy on the built image. The former Safety step was removed: its legacy
      # `safety check` command is deprecated/EOL and the replacement requires a
      # vendor account, while pip-audit covers the same advisory sources (PyPA).

      - name: Run pip-audit
        run: |
          cd backend
          # ChromaDB *server* advisories, not exploitable here: the app only ever
          # constructs chromadb.PersistentClient (services/vectordb.py) and never
          # runs the Chroma HTTP server, so its auth/RBAC/endpoint layers are
          # not reachable. No fixed release exists (1.5.9 is latest); drop each
          # ignore once one ships.
          #   PYSEC-2026-311   pre-auth code injection in the server API
          #   PYSEC-2026-3813  (CVE-2026-45830) cross-tenant read/write via the server API
          #   PYSEC-2026-3815  (CVE-2026-45831) SimpleRBACAuthorizationProvider ignores tenant scope
          #   PYSEC-2026-3814  (CVE-2026-45833) code injection via /api/v2/.../collections/{id}
          # pip-audit reports these under the PYSEC ids, so both spellings are
          # listed. The audit runs against requirements.lock — the exact,
          # hash-pinned set the Docker image installs — not the looser
          # requirements.txt.
          pip-audit -r requirements.lock --require-hashes --disable-pip \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

      - name: Upload security reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            gitleaks-report.json

  # ====================
  # Linting & Type Check
  # ====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install $(grep -E '^(ruff|mypy)==' backend/requirements-dev.txt)

      - name: Run Ruff (Linter)
        run: |
          ruff check backend/app scripts --output-format=github

      - name: Run Ruff (Formatter Check)
        run: |
          ruff format backend/app --check

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.6"

      - name: Check requirements.lock is current
        run: |
          cd backend
          # Re-resolve requirements.txt the way the lock's header says it was
          # made. Compiling over a COPY of the committed lock keeps its
          # versions as preferences (no --upgrade), so the only differences
          # that can appear are packages added, removed or re-pinned in
          # requirements.txt since the lock was last generated.
          cp requirements.lock /tmp/requirements.lock
          uv pip compile requirements.txt --universal --generate-hashes --python-version 3.11 \
            -o /tmp/requirements.lock --quiet
          # name==version per package; hashes, markers and comments ignored.
          pins() { grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*==' "$1" | sed -E 's/^([^ ;\\]+).*/\1/' | sort -u; }
          if ! diff <(pins requirements.lock) <(pins /tmp/requirements.lock); then
            echo "::error::backend/requirements.lock is stale relative to backend/requirements.txt ('<' committed lock, '>' fresh resolution above). Regenerate it: cd backend && uv pip compile requirements.txt --universal --generate-hashes --python-version 3.11 -o requirements.lock"
            exit 1
          fi
          echo "✅ requirements.lock matches requirements.txt"

      - name: Check NOTICE.md is current
        # NOTICE.md ships inside the image (Dockerfile copies it to /app), so a
        # dependency bump that is not reflected there distributes wrong
        # third-party attributions. Standard library only; needs pypi.org.
        run: |
          python3 scripts/generate_notice.py --check

      - name: Install backend dependencies for MyPy
        run: |
          pip install -r backend/requirements.lock

      - name: Run MyPy (ratcheted, blocking)
        # Blocking through scripts/mypy_ratchet.py: no package may exceed the
        # error count recorded in backend/mypy-baseline.json, and packages at
        # zero stay at zero. Lower the baseline with `--update` as debt is
        # paid down; it never goes up. The totals land in the job summary.
        run: |
          python3 scripts/mypy_ratchet.py | tee mypy.log
          echo "### MyPy ratchet" >> "$GITHUB_STEP_SUMMARY"
          head -n 1 mypy.log >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend dependency audit
        run: |
          cd frontend
          # Production dependencies only: what ships in the built bundle.
          npm audit --omit=dev --audit-level=high

      - name: Frontend Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Frontend Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Frontend Build
        run: |
          cd frontend
          npm run build

  # ====================
  # Backend Tests
  # ====================
  test:
    name: Backend Tests
    runs-on: ubuntu-24.04
    needs: [lint]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          # The hash-pinned lock is what the Docker image installs, so the
          # tests exercise the dependency set that ships.
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Fetch tokenizer encoding
        run: |
          # tiktoken downloads its encoding table on first use and caches it;
          # the test suite blocks outbound network, so fetch it beforehand.
          python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          ENCRYPTION_SALT: test-salt-for-ci-only
          DEBUG: "true"
          REDIS_URL: redis://localhost:6379/0
          # Dummy key so /ready reports ready (it requires an LLM provider);
          # no test makes a real API call with it.
          OPENAI_API_KEY: sk-test-ci-dummy-key-not-real
        run: |
          cd backend
          # Coverage floor: 50% (measured 58.6% with branch coverage on
          # 2026-10-04). Ratchet this number UP as coverage grows — never down.
          python -m pytest tests/ -v --cov=app --cov-branch --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=50

      - name: Coverage summary
        if: always()
        run: |
          cd backend
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-reports
          path: |
            backend/coverage.xml
            backend/htmlcov/

  # ====================
  # Frontend Tests
  # ====================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests with coverage
        run: |
          cd frontend
          npx vitest run --coverage --reporter=default

      - name: Upload frontend coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: frontend-coverage-reports
          path: |
            frontend/coverage/

  # ====================
  # Word add-in (lint, types, unit tests, build)
  # ====================
  word-addin:
    name: Word Add-in
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: word-addin/package-lock.json

      - name: Install dependencies
        run: |
          cd word-addin
          npm ci

      - name: Dependency audit
        run: |
          cd word-addin
          npm audit --omit=dev --audit-level=high

      - name: Lint
        run: |
          cd word-addin
          npm run lint

      - name: Type check
        run: |
          cd word-addin
          npx tsc --noEmit

      - name: Unit tests
        run: |
          cd word-addin
          npx vitest run

      - name: Build pane and manifest
        run: |
          cd word-addin
          npm run build
          npm run manifest -- --origin https://addin.example.com
          test -f dist/manifest.xml

  # ====================
  # E2E Tests (Playwright)
  # ====================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright test --reporter=html

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ====================
  # Migration Validation
  # ====================
  migration-check:
    name: Migration Validation
    runs-on: ubuntu-24.04
    needs: [lint]
    # Alembic imports app.config, whose production-mode validation (DEBUG
    # unset here — intentionally, to exercise the prod path) fails
    # closed without these. All values are CI-only dummies. Redis IS required:
    # migrations/env.py imports the models, and app.models.enums pulls in
    # app.services.auth, which constructs AuthService (and pings Redis) at
    # import time in non-debug mode.
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/casecite_test
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      ENCRYPTION_SALT: test-salt-for-ci-only
      AUDIT_HMAC_KEY: test-audit-hmac-key-for-ci-only-not-production
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-ci-dummy-key-not-real
      DISK_ENCRYPTION_ACKNOWLEDGED: "true"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: casecite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.lock

      - name: Upgrade to head
        run: |
          cd backend
          alembic upgrade head
          echo "✅ Upgrade to head succeeded"

      - name: Downgrade one revision
        run: |
          cd backend
          alembic downgrade -1
          echo "✅ Downgrade -1 succeeded"

      - name: Re-upgrade to head
        run: |
          cd backend
          alembic upgrade head
          echo "✅ Re-upgrade to head succeeded"

      - name: Check for schema drift
        run: |
          cd backend
          alembic check 2>&1 || {
            echo "::error::Schema drift detected — models have changes not captured in migrations. Run: alembic revision --autogenerate -m 'description'"
            exit 1
          }
          echo "✅ No schema drift detected"

      - name: Row-level security holds on PostgreSQL
        # The SQLite suite skips this: it proves that a query with no user
        # filter still returns only the caller's rows (app/rls.py).
        run: |
          cd backend
          pip install $(grep -E '^(pytest|pytest-asyncio|pytest-cov|anyio)==' requirements-dev.txt)
          python -m pytest tests/test_rls_postgres.py -q -p no:cacheprovider

  # ====================
  # Production-mode Smoke Test
  # ====================
  production-smoke:
    name: Production Smoke Test
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 15
    # The backend tests run with DEBUG=true on SQLite, so this is the only job
    # that boots the app the way a deployment does — DEBUG unset, Postgres,
    # Redis, fail-closed config — and then restarts it over the data the first
    # boot wrote. All values are CI-only dummies.
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/casecite_test
      # The service container's Postgres has no TLS; production mode otherwise forces it.
      DB_SSL: internal
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      ENCRYPTION_SALT: test-salt-for-ci-only
      AUDIT_HMAC_KEY: test-audit-hmac-key-for-ci-only-not-production
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-ci-dummy-key-not-real
      DISK_ENCRYPTION_ACKNOWLEDGED: "true"
      CORS_ORIGINS: https://ci.casecite.test
      # A public hostname only, as a real deployment sets it: the smoke test
      # reaches the app over loopback, which must stay allowed regardless.
      ALLOWED_HOSTS: ci.casecite.test
      REGISTRATION_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-not-a-secret
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: casecite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.lock

      - name: Migrate
        run: |
          cd backend
          alembic upgrade head

      - name: Boot, exercise, restart
        run: python scripts/smoke_production.py

  # ====================
  # Browser journeys against a live backend
  # ====================
  e2e-journeys:
    name: E2E Journeys (live backend)
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 25
    # The mocked E2E suite proves the UI; this one proves the product: a real
    # backend (SQLite, DEBUG) with the deterministic mock provider behind it
    # (scripts/mock_llm_server.py), driven by a browser through sign-in,
    # upload, indexing, research, a verified citation, deletion and the audit
    # trail. All values are CI-only dummies.
    env:
      DEBUG: "true"
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      ENCRYPTION_SALT: test-salt-for-ci-only
      OPENAI_API_KEY: mock-key-for-the-mock-provider
      OPENAI_BASE_URL: http://127.0.0.1:8089/v1
      EMBEDDING_BASE_URL: http://127.0.0.1:8089/v1
      EMBEDDING_MODEL: hash-768
      EMBEDDING_DIMENSIONS: "768"
      UPLOAD_DIR: ${{ github.workspace }}/.journeys/data/uploads
      CHROMA_PERSIST_DIR: ${{ github.workspace }}/.journeys/data/chroma
      DATABASE_URL: sqlite+aiosqlite:///${{ github.workspace }}/.journeys/data/casecite.db
      CORS_ORIGINS: http://localhost:3000
      JOURNEYS: "1"
      JOURNEYS_BACKEND_URL: http://localhost:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend && pip install -r requirements.lock && cd ..
          cd frontend && npm ci && npx playwright install --with-deps chromium && cd ..
          mkdir -p "$UPLOAD_DIR" "$CHROMA_PERSIST_DIR"

      - name: Start the mock provider and the backend
        run: |
          python scripts/mock_llm_server.py --port 8089 > .journeys/mock-llm.log 2>&1 &
          cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../.journeys/backend.log 2>&1 &
          cd ..
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && curl -sf http://127.0.0.1:8089/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8089/health

      - name: Run the journeys
        run: |
          cd frontend
          npx playwright test --project=journeys --reporter=html

      - name: Backend log on failure
        if: failure()
        run: tail -n 200 .journeys/backend.log .journeys/mock-llm.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v4
        with:
          name: playwright-journeys-report
          path: frontend/playwright-report/
          retention-days: 7

  # ====================
  # Backup-and-restore drill
  # ====================
  backup-restore:
    name: Backup and Restore Drill
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 20
    # A backup nobody has restored is a hope, not a backup. This job boots the
    # app in production mode, writes real data (the first admin account, its
    # sessions, audit entries), backs up the database and the data directory
    # with the shipped scripts, wipes both, restores them with the shipped
    # script, boots again over the restored state and signs in. All values
    # are CI-only dummies.
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/casecite_test
      DB_SSL: internal
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      ENCRYPTION_SALT: test-salt-for-ci-only
      AUDIT_HMAC_KEY: test-audit-hmac-key-for-ci-only-not-production
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: sk-test-ci-dummy-key-not-real
      DISK_ENCRYPTION_ACKNOWLEDGED: "true"
      CORS_ORIGINS: https://ci.casecite.test
      ALLOWED_HOSTS: ci.casecite.test
      REGISTRATION_BOOTSTRAP_TOKEN: ci-only-bootstrap-token-not-a-secret
      # The data directory the app writes (uploads, audit logs, key stores,
      # sessions) is UPLOAD_DIR's parent; the scripts archive and restore it.
      UPLOAD_DIR: ${{ github.workspace }}/.drill/data/uploads
      CHROMA_PERSIST_DIR: ${{ github.workspace }}/.drill/data/chroma
      # backup_database.sh / restore_database.sh in direct mode
      BACKUP_MODE: direct
      BACKUP_ALLOW_UNENCRYPTED: "true"
      BACKUP_DIR: ${{ github.workspace }}/.drill/backups
      DATA_DIR: ${{ github.workspace }}/.drill/data
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: casecite_test
      POSTGRES_USER: test
      PGPASSWORD: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: casecite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.lock
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          mkdir -p "$DATA_DIR/uploads" "$BACKUP_DIR"

      - name: Migrate and write real data (first boot)
        run: |
          cd backend && alembic upgrade head && cd ..
          python scripts/smoke_production.py --phase first

      - name: Back up with the shipped script
        run: |
          ./scripts/backup_database.sh
          ls -l "$BACKUP_DIR"
          test -s "$BACKUP_DIR"/casecite_test_*.sql.gz
          test -s "$BACKUP_DIR"/rag_data_*.tar.gz

      - name: Wipe the data directory and poison the database
        # The restore must bring back what was there, not what is there now.
        run: |
          rm -rf "$DATA_DIR"/* "$DATA_DIR"/.[!.]* 2>/dev/null || true
          psql -h localhost -U test -d casecite_test -v ON_ERROR_STOP=1 -c "DELETE FROM users;"
          test "$(psql -h localhost -U test -d casecite_test -At -c 'SELECT count(*) FROM users')" = "0"

      - name: Restore with the shipped script
        run: |
          ./scripts/restore_database.sh "$BACKUP_DIR"/casecite_test_*.sql.gz \
            --data "$BACKUP_DIR"/rag_data_*.tar.gz --yes
          test "$(psql -h localhost -U test -d casecite_test -At -c 'SELECT count(*) FROM users')" = "1"
          test -d "$DATA_DIR/audit_logs"

      - name: Boot over the restored state and sign in (second boot)
        run: python scripts/smoke_production.py --phase second

  # ====================
  # Build Docker Image
  # ====================
  build:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: [security-scan, test, test-frontend, test-e2e, e2e-journeys, migration-check, production-smoke, backup-restore]
    # Runs on pull requests too, so a Dockerfile change is built and
    # Trivy-scanned before it merges. Only pushes (main/develop, v* tags) log
    # in to GHCR, push the image and publish its SBOM — see the step `if`s.
    permissions:
      contents: write          # attach the SBOM to the release on v* tags
      packages: write          # push the image to GHCR
      security-events: write   # upload the Trivy SARIF
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image (scan before push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # /health reports this as the running build.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy on hosted runners cannot read images from the container store
      # (containerd socket permission denied) — scan an exported tarball instead.
      # Saved by the first tag metadata-action produced: on a pull request the
      # `sha` tag is the PR head commit, not github.sha (the merge commit).
      - name: Export image for scanning
        run: docker save -o /tmp/image.tar "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"

      - name: Run Trivy vulnerability scanner (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          input: /tmp/image.tar
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
          # Debian-slim always ships some upstream-unfixed CVEs; blocking on
          # them makes the gate permanently red. Fixable vulns still block.
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner (SARIF upload)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: always()
        with:
          input: /tmp/image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        if: always()
        # Informational: code scanning is unavailable on private repos, and the
        # blocking Trivy step above is the actual gate.
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Docker image (after Trivy passes)
        if: github.event_name == 'push'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Generate SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.json

      - name: Attach SBOM to the GitHub release
        # A workflow artifact expires; the release is where an evaluator looks
        # for the bill of materials of the image a tag refers to.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for this release."
          gh release upload "$GITHUB_REF_NAME" sbom.json --repo "$GITHUB_REPOSITORY" --clobber

  # ====================
  # Deployment — intentionally not included here
  # ====================
  # This pipeline builds, tests, and pushes a Docker image to GHCR.
  # That image is the universal deployment artifact. Actual CD (deploy)
  # jobs are environment-specific and belong in your own workflow file.
  #
  # Copy the template that matches your infra from deploy/examples/:
  #   - deploy-coolify-webhook.yml   (Coolify webhook trigger)
  #   - deploy-docker-compose.yml    (SSH to any VPS)
  #   - deploy-azure.yml             (Azure Container Apps)
  #
  # See docs/deployment.md for the full guide.
